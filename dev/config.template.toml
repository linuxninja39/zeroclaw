workspace_dir = "/zeroclaw-data/workspace"
config_path = "/zeroclaw-data/.zeroclaw/config.toml"
# This is the Ollama Base URL, not a secret key
api_key = "http://host.docker.internal:11434"
default_provider = "ollama"
default_model = "llama3.2"
default_temperature = 0.7

# Example public peers and explicit channel bindings.
# Public peers stay channel-facing only, there is no separate external peer API.
#
# [peers.ops]
# description = "Operations-facing assistant for the ops Telegram chat"
# identity_ref = "peers/ops.md"
# runtime_ref = "hint:ops-runtime"
#
# [[bindings]]
# channel = "telegram"
# conversation = "chat-ops"
# peer = "ops"
#
# [cron]
# enabled = true
#
# [[cron.jobs]]
# id = "ops-daily-digest"
# name = "Ops daily digest"
# job_type = "agent"
# prompt = "Summarize overnight incidents and post a concise handoff."
# target_public_peer = "ops"
# allowed_tools = ["memory_search", "memory_get"]
# session_target = "isolated"
#
# [cron.jobs.schedule]
# kind = "cron"
# expr = "0 14 * * *"
# tz = "America/Denver"
#
# [cron.jobs.delivery]
# mode = "announce"
# channel = "telegram"
# to = "chat-ops"
# best_effort = true

[gateway]
port = 42617
host = "[::]"
allow_public_bind = true
require_pairing = false

# Cost tracking and budget enforcement configuration
# Enable to track API usage costs and enforce spending limits
[cost]
enabled = false
daily_limit_usd = 10.0
monthly_limit_usd = 100.0
warn_at_percent = 80
allow_override = false

# Per-model pricing (USD per 1M tokens)
# Uncomment and customize to override default pricing
# [cost.prices."anthropic/claude-sonnet-4-20250514"]
# input = 3.0
# output = 15.0
#
# [cost.prices."openai/gpt-4o"]
# input = 5.0
# output = 15.0
